name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Program4.Community.slnx --configuration Release
      - run: dotnet run --project tests/Program4.Tests --configuration Release --no-build
      - run: dotnet run --project src/Program4.Cli --configuration Release --no-build -- samples/ticks.csv DEMO
