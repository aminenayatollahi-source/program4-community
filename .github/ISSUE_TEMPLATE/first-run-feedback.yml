name: First-run feedback
description: Share what happened when you ran the demo or tried your own CSV.
title: "[First run]: "
body:
  - type: dropdown
    id: installation
    attributes:
      label: How did you run the program?
      options:
        - Downloaded a release package
        - Built from source
        - Tried both methods
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: What did you try?
      options:
        - Bundled DEMO sample
        - My own CSV
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "Windows 11 x64 or Ubuntu 24.04 x64"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version (source builds only, optional)
      placeholder: "10.0.x"
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the command you ran, what you expected and the result. Successful runs are welcome. Use synthetic examples for anything shared publicly.
    validations:
      required: true
