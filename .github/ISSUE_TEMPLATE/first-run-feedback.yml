name: First-run feedback
description: Share what happened when you ran the demo or tried your own CSV.
title: "[First run]: "
body:
  - type: dropdown
    id: scenario
    attributes:
      label: What did you try?
      options:
        - Bundled DEMO sample
        - My own CSV
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and .NET SDK version
      placeholder: "Windows 11, .NET SDK 10.0.x"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the command you ran, what you expected and the result. Successful runs are welcome. Use synthetic examples for anything shared publicly.
    validations:
      required: true
